[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sir-seir-dirichlet-series"
version = "0.1.0"
description = "Minimal executable SIR/SEIR models with a finite exponential comparison"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[tool.setuptools]
py-modules = ["epidemic_models"]
